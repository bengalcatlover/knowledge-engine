- question: "利用者が増えるほど価値が上がるサービスで、初期の参加者不足をどう扱うべきか。"
  external_query: "network effects platforms"
- question: "担当者だけが知る判断基準が退職で失われないように、組織は何を記録・更新すべきか。"
  external_query: "organizational memory knowledge"
- question: "同じ指標を共有する複数チームが、責任の押し付け合いをせず協力する条件は何か。"
