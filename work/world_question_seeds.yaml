# 実生活・実ビジネス・他分野からの自己生成探索質問。
# すべてsyntheticであり、質問自体は事実・需要・証拠を主張しない。
# external_queryはMIT検索に使う英語主要語（2〜5語）。
- question: "在庫不足を避けるために発注量を増やすほど、かえって欠品と余剰が交互に大きくなる現象をどう説明・検証するか。"
  external_query: "inventory oscillation feedback"
- question: "複数のAIエージェントが同じ仕事を避けながら、停止や通信遅延があっても担当を決めるには何が必要か。"
  external_query: "distributed consensus fault tolerance"
- question: "売上KPIを改善した施策が顧客価値を損なっていないかを、どのような構造で検証すべきか。"
  external_query: "incentives measurement externalities"
- question: "小さな遅延が繰り返されることで、業務フロー全体が不安定化する条件をどう見つけるか。"
  external_query: "feedback delay stability"
- question: "限られた予算で複数の施策を試すとき、探索と成果の確定をどう両立させるか。"
  external_query: "exploration exploitation decision"
- question: "情報を圧縮して共有しても、重要な例外条件や否定条件を失わない設計はどう作るか。"
  external_query: "information compression distortion"
- question: "複数部門が各自の最適化を続けた結果、全体最適を失う問題をどう記述するか。"
  external_query: "game theory coordination"
- question: "過去の成功パターンが環境変化後に失敗へ反転する兆候を、どのように検出するか。"
  external_query: "nonstationary change detection"
- question: "異なる品質の情報を持つ参加者が取引するとき、価格や選別はどう歪むか。"
  external_query: "asymmetric information signaling"
- question: "測定ノイズが大きい状況で、改善施策の因果効果を誤判定しないには何が必要か。"
  external_query: "causal inference measurement"
- question: "待ち行列が長くなるほど処理を急がせても遅延が悪化する業務で、どの指標から詰まりを見つけるか。"
